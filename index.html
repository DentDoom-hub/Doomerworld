<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--y:#ffd600;--bg:#070b16;--blue:#1a73e8;--card:#fff;--txt:#202124;--sub:#5f6368}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Google Sans',Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
/* splash */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:radial-gradient(ellipse at 50% 40%,#1b2438 0%,#070b16 70%);z-index:50;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(78vw,440px);filter:drop-shadow(0 0 22px rgba(255,214,0,.35))}
#explore{background:var(--y);color:#111;border:0;border-radius:28px;padding:15px 46px;font:700 18px inherit;font-family:inherit;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 24px rgba(255,214,0,.3);transition:transform .15s}
#explore:hover{transform:scale(1.05)}
/* app */
#globe,#flat{position:absolute;inset:0}
#flat{z-index:1;background:#0b1020}
.leaflet-container{background:#0b1020;font-family:inherit}
.bar{position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.bar::-webkit-scrollbar{display:none}
.brand{flex:none;width:44px;height:44px;border-radius:12px;background:#151b2b;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.brand img{width:32px}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--txt);border:0;border-radius:22px;padding:0 16px;height:44px;font:500 14px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.chip:hover{background:#f1f3f4}
.chip svg{width:20px;height:20px;fill:var(--blue)}
.card{position:absolute;z-index:10;background:var(--card);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
#stat{left:12px;bottom:max(18px,env(safe-area-inset-bottom));padding:12px 16px;min-width:210px}
#stat b{font-size:22px}
#stat small{color:var(--sub);display:block;margin-top:2px;font-size:12px}
.pbar{height:6px;background:#e8eaed;border-radius:3px;margin:9px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb300,var(--y));width:0;transition:width .4s}
#reset{background:none;border:0;color:var(--sub);font:12px inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0}
#zoom{right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
#zoom button{width:44px;height:44px;border:0;background:none;font-size:24px;color:#444;cursor:pointer}
#zoom button+button{border-top:1px solid #e8eaed}
#zoom button:hover{background:#f1f3f4}
/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:18px;width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.box h2{margin:0;padding:20px 22px 4px;font-size:20px;font-weight:500}
.box .sub{padding:0 22px 12px;color:var(--sub);font-size:13px;line-height:1.45}
.box .body{padding:0 22px;overflow:auto;flex:1}
.box textarea,.box input[type=text]{width:100%;border:1px solid #dadce0;border-radius:10px;padding:12px;font:15px inherit;font-family:inherit;outline:none}
.box textarea{min-height:150px;resize:vertical}
.box textarea:focus,.box input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,115,232,.2)}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:16px 22px}
.foot .msg{flex:1;font-size:12px;color:var(--sub)}
.btn{border:0;border-radius:20px;padding:10px 22px;font:500 14px inherit;font-family:inherit;cursor:pointer;background:none;color:var(--blue)}
.btn:hover{background:#e8f0fe}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:#1765cc}
.btn:disabled{opacity:.45;cursor:default}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{padding:11px 6px;border-bottom:1px solid #f1f3f4;cursor:pointer;display:flex;justify-content:space-between;font-size:15px}
.list li:hover{background:#f8f9fa}
.list li em{font-style:normal;color:#e6a800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{padding:6px 12px;border-radius:16px;background:#e8f0fe;color:#174ea6;font-size:13px;cursor:pointer;border:1px solid #c6dafc}
.tag.off{background:#f1f3f4;color:#80868b;border-color:#dadce0;text-decoration:line-through}
.how{font-size:12.5px;color:var(--sub);background:#f8f9fa;border-radius:10px;padding:10px 12px;line-height:1.5;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:60;max-width:88vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;color:#cfd6e6;font-size:14px;text-align:center;padding:20px}
.spin{width:38px;height:38px;border:4px solid #2a3350;border-top-color:var(--y);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.tip{background:#fff;color:#202124;padding:6px 10px;border-radius:8px;font:500 13px Roboto,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.leaflet-tooltip{border:0;border-radius:8px;font-weight:500}
</style>
</head>

<script>
(function(){
const $=s=>document.querySelector(s);
const KEY='doomerworld:v1';
const SAT=['https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/earth-blue-marble.jpg','https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg','https://cdn.jsdelivr.net/gh/vasturiano/three-globe@master/example/img/earth-blue-marble.jpg'];
const GEOS=['https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_50m_admin_0_countries.geojson','https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson','https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson'];
const TINY='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const W=4096,H=2048;
let features=[],visited=new Set(),customs=[],sat,canvas,ctx,tex,globe,map,flatLayer,custLayer,flatFeature,index=new Map(),started=false,hov=null;

let fogC,fogRaf,busy=false,lvl=0;const BB=new WeakMap();
/* ---------- stato ---------- */
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){visited=new Set(s.visited||[]);customs=s.customs||[];}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({visited:[...visited],customs}))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}

/* ---------- nomi ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let dn;try{dn=new Intl.DisplayNames(['it'],{type:'region'})}catch(e){}
function itName(f){
  if(f._it)return f._it;const p=f.properties;let n=p.NAME_IT||p.NAME;
  try{const c=p.ISO_A2_EH&&p.ISO_A2_EH!=='-99'?p.ISO_A2_EH:p.ISO_A2;if(c&&c!=='-99'&&dn){const r=dn.of(c);if(r&&r!==c)n=r}}catch(e){}
  return f._it=n;
}
const ALIAS={'usa':'United States of America','stati uniti':'United States of America','america':'United States of America','uk':'United Kingdom','inghilterra':'United Kingdom','scozia':'United Kingdom','galles':'United Kingdom','gran bretagna':'United Kingdom','regno unito':'United Kingdom','olanda':'Netherlands','paesi bassi':'Netherlands','emirati arabi':'United Arab Emirates','uae':'United Arab Emirates','dubai':'United Arab Emirates','corea del sud':'South Korea','corea':'South Korea','repubblica ceca':'Czechia','cechia':'Czechia','birmania':'Myanmar','macedonia':'North Macedonia','costa d avorio':'Ivory Coast','swaziland':'eSwatini','bahamas':'The Bahamas','tanzania':'United Republic of Tanzania','serbia':'Republic of Serbia','congo':'Republic of the Congo','rd congo':'Democratic Republic of the Congo','capo verde':'Cabo Verde','timor est':'East Timor','russia':'Russia','vaticano':'Vatican','san marino':'San Marino','turkiye':'Turkey','turchia':'Turkey'};
function buildIndex(){
  index=new Map();
  for(const f of features){const p=f.properties;
    [p.ADMIN,p.NAME,p.NAME_LONG,p.NAME_IT,p.NAME_EN,itName(f),p.SOVEREIGNT].forEach(n=>{const k=norm(n);if(k&&!index.has(k))index.set(k,f)});}
  for(const [a,t] of Object.entries(ALIAS)){const f=index.get(norm(t));if(f)index.set(norm(a),f)}
}
const byKey=k=>features.find(f=>f.properties.ADMIN===k);

/* ---------- disegno texture (reveal) ---------- */
function addGeom(g){
  const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
  for(const poly of polys)for(const ring of poly)for(const off of [-W,0,W]){
    let prev=null,shift=0;
    ring.forEach(([lo,la],i)=>{
      if(prev!==null){const d=lo-prev;if(d>180)shift-=360;else if(d<-180)shift+=360}
      prev=lo;const x=(lo+shift+180)/360*W+off,y=(90-la)/180*H;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });ctx.closePath();
  }
}
function paint(){
  ctx.filter='none';ctx.drawImage(sat,0,0,W,H);
  ctx.fillStyle='rgba(9,13,26,.72)';ctx.fillRect(0,0,W,H);
  const geoms=[...features.filter(f=>visited.has(f.properties.ADMIN)).map(f=>f.geometry),...customs.map(c=>c.geometry)];
  for(const g of geoms){
    ctx.save();ctx.beginPath();addGeom(g);ctx.clip('evenodd');
    try{ctx.filter='saturate(1.3) brightness(1.08)'}catch(e){}
    ctx.drawImage(sat,0,0,W,H);ctx.restore();
  }
  ctx.filter='none';ctx.strokeStyle='rgba(255,214,0,.85)';ctx.lineWidth=2;
  for(const g of geoms){ctx.beginPath();addGeom(g);ctx.stroke()}
  if(tex)tex.needsUpdate=true;
}
function stats(){
  const cs=new Set(visited),t=features.length||1;
  customs.forEach(c=>{if(c._cc===undefined){const b=bboxOf(c.geometry);const f=countryAt((b[1]+b[3])/2,(b[0]+b[2])/2);c._cc=f?f.properties.ADMIN:null}if(c._cc)cs.add(c._cc)});
  const n=customs.length+visited.size;
  $('#sN').textContent=n;$('#sT').textContent=n===1?'luogo visitato':'luoghi visitati';
  $('#sP').style.width=Math.min(100,cs.size/t*100).toFixed(1)+'%';
  $('#sZ').textContent=`${cs.size} ${cs.size===1?'paese toccato':'paesi toccati'} · ${(cs.size/t*100).toFixed(1)}% del mondo`;
}
function refresh(){save();paint();stats();if(map&&!$('#flat').hidden)drawFlat()}

function toggle(f){
  const k=f.properties.ADMIN;
  if(visited.has(k)){visited.delete(k);toast(itName(f)+' rimosso')}else{visited.add(k);toast(itName(f)+' aggiunto ✓')}
  refresh();
}

/* ---------- globo ---------- */
function polyStyle(){
  globe.polygonAltitude(d=>d===hov?.015:.003)
       .polygonCapColor(d=>d===hov?'rgba(255,255,255,.2)':'rgba(255,255,255,.004)');
}
function initGlobe(){
  globe=Globe()($('#globe'))
    .backgroundColor('#070b16').atmosphereColor('#7aa7ff').atmosphereAltitude(.18)
    .globeImageUrl(TINY)
    .onGlobeClick(p=>handleClick(p.lat,p.lng))
    .pointOfView({lat:25,lng:10,altitude:2.4});
  const c=globe.controls();c.minDistance=104;c.enableDamping=true;
  globe.onZoom&&globe.onZoom(({altitude})=>{c.rotateSpeed=Math.max(.12,Math.min(1,altitude*.55))});
  const size=()=>globe.width(innerWidth).height(innerHeight);size();addEventListener('resize',size);
  const t=setInterval(()=>{
    const m=globe.globeMaterial();
    if(m.map&&m.map.image){clearInterval(t);
      tex=new m.map.constructor(canvas);tex.anisotropy=8;if(m.map.colorSpace!==undefined)tex.colorSpace=m.map.colorSpace;
      m.map=tex;m.needsUpdate=true;paint();
    }
  },60);
}

/* ---------- vista nazione (piatta) ---------- */
function mainBounds(f){
  const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
  let best=null,ba=-1;
  for(const p of polys){let a=1e9,b=1e9,c=-1e9,d=-1e9;p[0].forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});
    const ar=(c-a)*(d-b);if(ar>ba){ba=ar;best=[[b,a],[d,c]]}}
  return best;
}
const geomsAll=()=>[...features.filter(f=>visited.has(f.properties.ADMIN)).map(f=>f.geometry),...customs.map(c=>c.geometry)];
function bboxOf(g){let r=BB.get(g);if(r)return r;let a=1e9,b=1e9,c=-1e9,d=-1e9;
  (g.type==='Polygon'?[g.coordinates]:g.coordinates).forEach(p=>p[0].forEach(([x,y])=>{if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}));
  r=[a,b,c,d];BB.set(g,r);return r}
function drawFog(){
  if(!map||$('#flat').hidden||!fogC)return;
  const s=map.getSize(),dpr=Math.min(window.devicePixelRatio||1,2),W2=Math.round(s.x*dpr),H2=Math.round(s.y*dpr);
  if(fogC.width!==W2||fogC.height!==H2){fogC.width=W2;fogC.height=H2;fogC.style.width=s.x+'px';fogC.style.height=s.y+'px'}
  const c=fogC.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  c.globalCompositeOperation='source-over';c.clearRect(0,0,s.x,s.y);c.fillStyle='rgba(9,13,26,.62)';c.fillRect(0,0,s.x,s.y);
  c.globalCompositeOperation='destination-out';c.fillStyle='#000';
  const vb=map.getBounds(),w=vb.getWest(),e=vb.getEast(),so=vb.getSouth(),no=vb.getNorth();
  for(const g of geomsAll()){const bb=bboxOf(g);if(bb[2]<w||bb[0]>e||bb[3]<so||bb[1]>no)continue;
    c.beginPath();
    for(const poly of (g.type==='Polygon'?[g.coordinates]:g.coordinates))for(const ring of poly){
      const st=Math.max(1,Math.floor(ring.length/1200));
      for(let i=0;i<ring.length;i+=st){const p=map.latLngToContainerPoint([ring[i][1],ring[i][0]]);i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)}
      c.closePath()}
    c.fill('evenodd')}
  c.globalCompositeOperation='source-over';
}
function drawFlat(){
  if(!map)return;
  if(flatLayer)map.removeLayer(flatLayer);if(custLayer)map.removeLayer(custLayer);
  flatLayer=flatFeature?L.geoJSON(flatFeature,{interactive:false,style:{color:'rgba(255,255,255,.7)',weight:1.5,fill:false}}).addTo(map):null;
  custLayer=L.geoJSON(customs.map(c=>({type:'Feature',geometry:c.geometry})),{interactive:false,style:{color:'#ffd600',weight:1.5,fill:false}}).addTo(map);
  drawFog();
}
function openFlat(f){
  flatFeature=f;$('#flat').hidden=false;$('#globe').style.visibility='hidden';
  $('#bBack').hidden=false;$('#bNation').hidden=true;
  if(!map){
    map=L.map('flat',{zoomControl:false,preferCanvas:true,worldCopyJump:true,minZoom:2});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Imagery © Esri'}).addTo(map);
    fogC=document.createElement('canvas');fogC.style.cssText='position:absolute;left:0;top:0;z-index:450;pointer-events:none';
    map.getContainer().appendChild(fogC);
    map.on('move zoom resize moveend',()=>{cancelAnimationFrame(fogRaf);fogRaf=requestAnimationFrame(drawFog)});
    map.on('click',e=>handleClick(e.latlng.lat,e.latlng.lng));
  }
  map.invalidateSize();map.fitBounds(mainBounds(f),{padding:[60,60]});drawFlat();
}
const LEVELS=[{n:'Città',z:10},{n:'Provincia',z:8},{n:'Regione',z:5},{n:'Nazione',z:3}];
async function handleClick(lat,lng){
  if(busy)return;
  const lv=LEVELS[lvl];
  if(lv.z===3){const f=countryAt(lat,lng);if(f)toggle(f);else toast('Nessuna nazione qui');return}
  busy=true;toast('Cerco il luogo…');
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=${lv.z}&polygon_geojson=1&polygon_threshold=0.002&accept-language=it&lat=${lat}&lon=${lng}`);
    const j=await r.json();
    if(!j||j.error){toast('Nessun luogo trovato qui');return}
    let g=j.geojson;if(!g||(g.type!=='Polygon'&&g.type!=='MultiPolygon'))g=circle(+j.lon,+j.lat,.06);
    const id=(j.osm_type||'x')+(j.osm_id||j.place_id);
    const name=j.name||(j.display_name||'').split(',')[0]||'Luogo';
    const i=customs.findIndex(c=>c.id===id);
    if(i>=0){customs.splice(i,1);toast(name+' rimosso')}else{customs.push({id,name,geometry:g});toast(name+' aggiunto ✓')}
    refresh();
  }catch(e){toast('Non riesco a contattare il servizio mappe')}
  finally{setTimeout(()=>{busy=false},1000)}
}
$('#bLvl').onclick=()=>{lvl=(lvl+1)%LEVELS.length;$('#bLvlT').textContent=LEVELS[lvl].n;toast('Ora tocchi: '+LEVELS[lvl].n)};
function closeFlat(){
  const b=mainBounds(flatFeature);
  $('#flat').hidden=true;$('#globe').style.visibility='visible';
  $('#bBack').hidden=true;$('#bNation').hidden=false;
  globe.pointOfView({lat:(b[0][0]+b[1][0])/2,lng:(b[0][1]+b[1][1])/2,altitude:1.3},900);
}

/* ---------- zoom ---------- */
function zoom(k){
  if(!$('#flat').hidden){k<1?map.zoomIn():map.zoomOut();return}
  const p=globe.pointOfView();globe.pointOfView({altitude:Math.min(4,Math.max(.12,p.altitude*k))},300);
}
$('#zi').onclick=()=>zoom(.6);$('#zo').onclick=()=>zoom(1.6);

/* ---------- modal ---------- */
function modal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()};return m}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Nazione */
$('#bNation').onclick=()=>{
  const list=[...features].sort((a,b)=>itName(a).localeCompare(itName(b),'it'));
  const m=modal(`<div class="box"><h2>Scegli una nazione</h2><div class="sub">Si apre la vista piatta per vederla meglio.</div>
    <div class="body"><input type="text" id="q" placeholder="Cerca…" autocomplete="off"><ul class="list" id="ul"></ul></div>
    <div class="foot"><button class="btn" id="x">Chiudi</button></div></div>`);
  const ul=m.querySelector('#ul');
  const fill=q=>{const k=norm(q);ul.innerHTML='';
    list.filter(f=>!k||norm(itName(f)).includes(k)||norm(f.properties.NAME).includes(k)).forEach(f=>{
      const li=document.createElement('li');li.innerHTML=`<span>${esc(itName(f))}</span>${visited.has(f.properties.ADMIN)?'<em>✓ visitato</em>':''}`;
      li.onclick=()=>{closeModal();openFlat(f)};ul.appendChild(li)})};
  fill('');m.querySelector('#q').oninput=e=>fill(e.target.value);m.querySelector('#x').onclick=closeModal;
  setTimeout(()=>m.querySelector('#q').focus(),50);
};
$('#bBack').onclick=closeFlat;

/* Aggiungi manualmente */
function circle(lo,la,r){const pts=[];for(let i=0;i<=24;i++){const a=i/24*2*Math.PI;pts.push([lo+r*Math.cos(a)/Math.max(.2,Math.cos(la*Math.PI/180)),la+r*Math.sin(a)])}return{type:'Polygon',coordinates:[pts]}}
async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&polygon_geojson=1&polygon_threshold=0.002&accept-language=it&q='+encodeURIComponent(q));
  const j=await r.json();if(!j[0])return null;
  let g=j[0].geojson;
  if(!g||(g.type!=='Polygon'&&g.type!=='MultiPolygon'))g=circle(+j[0].lon,+j[0].lat,j[0].category==='place'?.06:.18);
  return{id:(j[0].osm_type||'x')+(j[0].osm_id||j[0].place_id),name:(j[0].display_name||q).split(',')[0],geometry:g};
}
$('#bAdd').onclick=()=>{
  const m=modal(`<div class="box"><h2>Aggiungi manualmente</h2>
    <div class="sub">Scrivi uno o più posti (paesi, regioni, città, isole…): uno per riga, oppure separati da virgola. Poi un unico OK.</div>
    <div class="body"><textarea id="t" placeholder="Giappone&#10;Patagonia&#10;Bali&#10;Islanda"></textarea></div>
    <div class="foot"><span class="msg" id="msg"></span><button class="btn" id="x">Annulla</button><button class="btn p" id="ok">OK</button></div></div>`);
  const t=m.querySelector('#t'),msg=m.querySelector('#msg'),ok=m.querySelector('#ok');
  m.querySelector('#x').onclick=closeModal;setTimeout(()=>t.focus(),50);
  ok.onclick=async()=>{
    const raw=t.value;const items=(/[\n;]/.test(raw)?raw.split(/[\n;]+/):raw.split(',')).map(s=>s.trim()).filter(Boolean);
    if(!items.length)return;ok.disabled=true;const added=[],missed=[];
    for(let i=0;i<items.length;i++){
      msg.textContent=`Cerco ${items[i]} (${i+1}/${items.length})…`;
      const f=index.get(norm(items[i]));
      if(f){visited.add(f.properties.ADMIN);added.push(itName(f));continue}
      try{const g=await geocode(items[i]);
        if(g){if(!customs.some(c=>c.id===g.id))customs.push(g);added.push(g.name)}else missed.push(items[i]);
        if(i<items.length-1)await new Promise(r=>setTimeout(r,1100));
      }catch(e){missed.push(items[i])}
    }
    refresh();ok.disabled=false;
    if(missed.length){t.value=missed.join('\n');msg.textContent='Non trovati: rivedi i nomi rimasti e riprova.';
      if(added.length)toast('Aggiunti: '+added.join(', '))}
    else{closeModal();toast('Aggiunti: '+added.join(', '))}
  };
};

/* utilità geografiche */
function ringHas(r,x,y){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function countryAt(lat,lon){
  for(const f of features){
    const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
    if(!f._bb){f._bb=polys.map(p=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;p[0].forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});return[a,b,c,d]})}
    for(let i=0;i<polys.length;i++){const bb=f._bb[i];
      if(lon<bb[0]||lon>bb[2]||lat<bb[1]||lat>bb[3])continue;
      if(ringHas(polys[i][0],lon,lat)&&!polys[i].slice(1).some(h=>ringHas(h,lon,lat)))return f}
  }return null;
}
$('#reset').onclick=()=>{if(confirm('Vuoi azzerare tutta la mappa?')){visited.clear();customs=[];refresh()}};

/* ---------- avvio ---------- */
const tmo=(p,ms,l)=>new Promise((res,rej)=>{const x=setTimeout(()=>rej(new Error(l+': troppo lento')),ms);p.then(v=>{clearTimeout(x);res(v)},e=>{clearTimeout(x);rej(e)})});
function loadImg(i){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);
  im.onerror=()=>i+1<SAT.length?loadImg(i+1).then(res,rej):rej(new Error('immagine satellitare non raggiungibile'));im.src=SAT[i]})}
async function loadGeo(){let last;
  for(const u of GEOS){try{const r=await tmo(fetch(u),40000,'confini');if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await tmo(r.json(),40000,'confini');if(j&&j.features&&j.features.length)return j;throw new Error('dati vuoti')}catch(e){last=e}}
  throw last||new Error('confini non raggiungibili')}
async function start(){
  if(started)return;started=true;
  $('#app').hidden=false;$('#loading').hidden=false;
  let step='librerie';
  try{
    if(typeof Globe==='undefined')throw new Error('libreria del globo non caricata');
    if(typeof L==='undefined')throw new Error('libreria della mappa non caricata');
    step='immagine satellitare';$('#loadMsg').textContent='Carico le immagini satellitari…';
    const im=await tmo(loadImg(0),60000,'immagine satellitare');
    step='confini dei paesi';$('#loadMsg').textContent='Carico i confini dei paesi…';
    const gj=await loadGeo();
    step='preparazione';
    sat=im;features=gj.features.filter(f=>f.properties&&f.properties.ADMIN&&f.geometry);
    if(!features.length)throw new Error('nessun paese nei dati');
    buildIndex();
    canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('canvas non disponibile');
    step='globo 3D';$('#loadMsg').textContent='Costruisco il globo…';
    await new Promise(r=>setTimeout(r,30));
    initGlobe();stats();
    setTimeout(()=>{$('#loading').hidden=true;toast('Zooma e tocca un posto per colorarlo')},500);
  }catch(e){
    started=false;
    $('#loadMsg').innerHTML='Qualcosa non va nel passo: <b>'+step+'</b><br><small style="opacity:.8">'+esc(e&&e.message||e)+'</small><br><br><button class="btn p" onclick="location.reload()">Riprova</button>';
  }
}
$('#explore').onclick=()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').hidden=true,500);start()};
})();
</script>
