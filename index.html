<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css">
<style>
:root{--y:#ffd600;--bg:#070b16;--blue:#1a73e8;--card:#fff;--txt:#202124;--sub:#5f6368}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Google Sans',Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;z-index:50;transition:opacity .5s;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),radial-gradient(ellipse at 50% 38%,#5b21b6 0%,#2e1065 48%,#12042e 100%)}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{width:min(80vw,470px);height:auto;filter:drop-shadow(0 0 30px rgba(255,214,0,.28))}
.btnwrap{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.55));transition:filter .15s,transform .15s}
.btnwrap:hover{transform:translate(3px,3px);filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55))}
.btnwrap:active{transform:translate(6px,6px);filter:drop-shadow(0 0 0 rgba(0,0,0,.55))}
#explore{display:flex;align-items:center;gap:18px;border:0;background:#ffd600;color:#1a0638;font:900 20px/1 inherit;font-family:inherit;letter-spacing:.3em;text-transform:uppercase;padding:22px 34px 22px 44px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
#explore svg{width:26px;height:20px;fill:none;stroke:#1a0638;stroke-width:4.5;stroke-linecap:butt;stroke-linejoin:miter}
#explore:hover svg{animation:nudge .6s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateX(6px)}}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
.bar{position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.bar::-webkit-scrollbar{display:none}
.brand{flex:none;width:44px;height:44px;border-radius:12px;background:#2e1065;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.brand img{width:34px}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--txt);border:0;border-radius:22px;padding:0 16px;height:44px;font:500 14px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.chip svg{width:20px;height:20px;fill:var(--blue)}
.card{position:absolute;z-index:10;background:var(--card);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
#stat{left:12px;bottom:max(18px,env(safe-area-inset-bottom));padding:12px 16px;min-width:210px}
#stat b{font-size:22px}
.pbar{height:6px;background:#e8eaed;border-radius:3px;margin:9px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb300,var(--y));width:0;transition:width .4s}
#sZ{color:var(--sub);font-size:12px;display:block}
#reset{background:none;border:0;color:var(--sub);font:12px inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-top:2px}
#zoom{right:12px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 26px);display:flex;flex-direction:column;overflow:hidden}
#zoom button{width:44px;height:44px;border:0;background:none;font-size:24px;color:#444;cursor:pointer}
#zoom button+button{border-top:1px solid #e8eaed}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:18px;width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.box h2{margin:0;padding:20px 22px 4px;font-size:20px;font-weight:500}
.box .sub{padding:0 22px 12px;color:var(--sub);font-size:13px;line-height:1.45}
.box .body{padding:0 22px;overflow:auto;flex:1}
.box textarea,.box input[type=text]{width:100%;border:1px solid #dadce0;border-radius:10px;padding:12px;font:16px inherit;font-family:inherit;outline:none}
.box textarea{min-height:150px;resize:vertical}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:16px 22px}
.foot .msg{flex:1;font-size:12px;color:var(--sub)}
.btn{border:0;border-radius:20px;padding:10px 22px;font:500 14px inherit;font-family:inherit;cursor:pointer;background:none;color:var(--blue)}
.btn.p{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{padding:11px 6px;border-bottom:1px solid #f1f3f4;cursor:pointer;display:flex;justify-content:space-between;font-size:15px}
.list li em{font-style:normal;color:#e6a800}

.cgrid{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.cgrid button{border:1px solid #dadce0;background:#fff;border-radius:18px;padding:9px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer;color:var(--txt)}
.cgrid button.w{background:#e8f0fe;border-color:#c6dafc;color:#174ea6}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:60;max-width:88vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;color:#cfd6e6;font-size:14px;text-align:center;padding:20px}
.spin{width:38px;height:38px;border:4px solid #2a3350;border-top-color:var(--y);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const KEY='doomerworld:v1';
const GEOS=['https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_50m_admin_0_countries.geojson','https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson','https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson'];
const EMPTY={type:'FeatureCollection',features:[]};
let features=[],visited=new Set(),customs=[],index=new Map(),map,started=false,busy=false,ready=false;
const BB=new WeakMap();

/* ---------- stato ---------- */
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){visited=new Set(s.visited||[]);customs=s.customs||[];}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({visited:[...visited],customs:customs.map(c=>({id:c.id,name:c.name,geometry:c.geometry}))}))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- nomi paesi ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let dn;try{dn=new Intl.DisplayNames(['it'],{type:'region'})}catch(e){}
function itName(f){
  if(f._it)return f._it;const p=f.properties;let n=p.NAME_IT||p.NAME;
  try{const c=p.ISO_A2_EH&&p.ISO_A2_EH!=='-99'?p.ISO_A2_EH:p.ISO_A2;if(c&&c!=='-99'&&dn){const r=dn.of(c);if(r&&r!==c)n=r}}catch(e){}
  return f._it=n;
}
const ALIAS={'usa':'United States of America','stati uniti':'United States of America','america':'United States of America','uk':'United Kingdom','inghilterra':'United Kingdom','scozia':'United Kingdom','galles':'United Kingdom','gran bretagna':'United Kingdom','regno unito':'United Kingdom','olanda':'Netherlands','paesi bassi':'Netherlands','emirati arabi':'United Arab Emirates','uae':'United Arab Emirates','corea del sud':'South Korea','repubblica ceca':'Czechia','cechia':'Czechia','birmania':'Myanmar','macedonia':'North Macedonia','costa d avorio':'Ivory Coast','swaziland':'eSwatini','bahamas':'The Bahamas','tanzania':'United Republic of Tanzania','serbia':'Republic of Serbia','congo':'Republic of the Congo','rd congo':'Democratic Republic of the Congo','capo verde':'Cabo Verde','turchia':'Turkey'};
function buildIndex(){
  index=new Map();
  for(const f of features){const p=f.properties;
    [p.ADMIN,p.NAME,p.NAME_LONG,p.NAME_IT,p.NAME_EN,itName(f),p.SOVEREIGNT].forEach(n=>{const k=norm(n);if(k&&!index.has(k))index.set(k,f)});}
  for(const [a,t] of Object.entries(ALIAS)){const f=index.get(norm(t));if(f)index.set(norm(a),f)}
}

/* ---------- geometria ---------- */
const polysOf=g=>g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
function bboxOf(g){let r=BB.get(g);if(r)return r;let a=1e9,b=1e9,c=-1e9,d=-1e9;
  polysOf(g).forEach(p=>p[0].forEach(([x,y])=>{if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}));
  r=[a,b,c,d];BB.set(g,r);return r}
function ringHas(r,x,y){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function inGeom(g,lat,lon){const bb=bboxOf(g);if(lon<bb[0]||lon>bb[2]||lat<bb[1]||lat>bb[3])return false;
  return polysOf(g).some(p=>ringHas(p[0],lon,lat)&&!p.slice(1).some(h=>ringHas(h,lon,lat)))}
function countryAt(lat,lon){for(const f of features)if(inGeom(f.geometry,lat,lon))return f;return null}
function circle(lo,la,r){const pts=[];for(let i=0;i<=24;i++){const a=i/24*2*Math.PI;pts.push([lo+r*Math.cos(a)/Math.max(.2,Math.cos(la*Math.PI/180)),la+r*Math.sin(a)])}return{type:'Polygon',coordinates:[pts]}}
function mainBounds(g){let best=null,ba=-1;
  for(const p of polysOf(g)){let a=1e9,b=1e9,c=-1e9,d=-1e9;p[0].forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});
    const ar=(c-a)*(d-b);if(ar>ba){ba=ar;best=[[a,b],[c,d]]}}
  return best}
function flyTo(g,maxZoom){const b=mainBounds(g);if(b)map.fitBounds(b,{padding:60,maxZoom:maxZoom||12,duration:1400})}

/* ---------- livelli e layer ---------- */
const LV=[[4.3,'Nazione',3],[6,'Regione',5],[8.2,'Provincia',8],[99,'Comune',10]];
const lvFor=z=>LV.find(l=>z<l[0]);
function updateLayers(){
  if(!ready)return;
  const vf=features.filter(f=>visited.has(f.properties.ADMIN));
  const incl=vf.map(f=>f.geometry);
  const area=g=>{const b=bboxOf(g);return (b[2]-b[0])*(b[3]-b[1])};
  [...customs].sort((a,b)=>area(b.geometry)-area(a.geometry)).forEach(c=>{
    const b=bboxOf(c.geometry),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
    if(!incl.some(g=>inGeom(g,cy,cx)))incl.push(c.geometry)});
  const holes=[];incl.forEach(g=>polysOf(g).forEach(p=>holes.push(p[0])));
  const outer=[[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]];
  map.getSource('fog').setData({type:'Feature',geometry:{type:'Polygon',coordinates:[outer,...holes]}});
  map.getSource('vis').setData({type:'FeatureCollection',features:[...vf.map(f=>({type:'Feature',geometry:f.geometry})),...customs.map(c=>({type:'Feature',geometry:c.geometry}))]});
}
function stats(){
  const cs=new Set(visited),t=features.length||1;
  customs.forEach(c=>{if(c._cc===undefined){const b=bboxOf(c.geometry);const f=countryAt((b[1]+b[3])/2,(b[0]+b[2])/2);c._cc=f?f.properties.ADMIN:null}if(c._cc)cs.add(c._cc)});
  const n=customs.length+visited.size;
  $('#sN').textContent=n;$('#sT').textContent=n===1?'luogo visitato':'luoghi visitati';
  $('#sP').style.width=Math.min(100,cs.size/t*100).toFixed(1)+'%';
  $('#sZ').textContent=`${cs.size} ${cs.size===1?'paese toccato':'paesi toccati'} · ${(cs.size/t*100).toFixed(1)}% del mondo`;
}
function refresh(){save();updateLayers();stats()}

/* ---------- tocco sulla mappa ---------- */
async function handleClick(lat,lng){
  if(!ready||busy)return;
  const lv=lvFor(map.getZoom());
  if(lv[2]===3){const f=countryAt(lat,lng);if(!f){toast('Nessuna nazione qui');return}
    const k=f.properties.ADMIN;if(visited.has(k)){visited.delete(k);toast(itName(f)+' rimosso')}else{visited.add(k);toast(itName(f)+' aggiunto ✓')}
    refresh();return}
  busy=true;toast('Cerco il luogo…');
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=${lv[2]}&polygon_geojson=1&polygon_threshold=0.0005&accept-language=it&lat=${lat}&lon=${lng}`);
    const j=await r.json();
    if(!j||j.error){toast('Nessun luogo trovato qui');return}
    let g=j.geojson;if(!g||(g.type!=='Polygon'&&g.type!=='MultiPolygon'))g=circle(+j.lon,+j.lat,.004);
    const id=(j.osm_type||'x')+(j.osm_id||j.place_id);
    const name=j.name||(j.display_name||'').split(',')[0]||'Luogo';
    const i=customs.findIndex(c=>c.id===id);
    if(i>=0){customs.splice(i,1);toast(name+' rimosso')}else{customs.push({id,name,geometry:g});toast(name+' aggiunto ✓')}
    refresh();
  }catch(e){toast('Non riesco a contattare il servizio mappe')}
  finally{setTimeout(()=>{busy=false},900)}
}

/* ---------- stile mappa ---------- */
function makeStyle(){
  const nm=['coalesce',['get','name:it'],['get','name']];
  const halo={'text-color':'#fff','text-halo-color':'rgba(0,0,0,.85)','text-halo-width':1.6};
  const bnd=(id,lvl,minz,w,op,dash)=>({id,type:'line',source:'omt','source-layer':'boundary',minzoom:minz,
    filter:['all',['==',['get','admin_level'],lvl],['!=',['get','maritime'],1]],
    paint:Object.assign({'line-color':'#ffffff','line-width':w,'line-opacity':op},dash?{'line-dasharray':dash}:{})});
  const lab=(id,cls,minz,maxz,size,bold)=>({id,type:'symbol',source:'omt','source-layer':'place',minzoom:minz,maxzoom:maxz,
    filter:Array.isArray(cls)?['in',['get','class'],['literal',cls]]:['==',['get','class'],cls],
    layout:{'text-field':nm,'text-font':[bold?'Noto Sans Bold':'Noto Sans Regular'],'text-size':size,'text-max-width':8,'symbol-sort-key':['get','rank']},paint:halo});
  return{version:8,projection:{type:'globe'},
    glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{
      sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:17,attribution:'Imagery © Esri'},
      omt:{type:'vector',url:'https://tiles.openfreemap.org/planet'},
      fog:{type:'geojson',data:EMPTY},vis:{type:'geojson',data:EMPTY}},
    layers:[
      {id:'bg',type:'background',paint:{'background-color':'#0b1020'}},
      {id:'sat',type:'raster',source:'sat'},
      {id:'fog',type:'fill',source:'fog',paint:{'fill-color':'#090d1a','fill-opacity':.68}},
      {id:'vis-fill',type:'fill',source:'vis',paint:{'fill-color':'#ffd600','fill-opacity':.08}},
      bnd('b2',2,0,1.6,.85),bnd('b4',4,3,1.1,.65,[3,2]),bnd('b6',6,5.5,1,.6,[3,2]),bnd('b8',8,8,.9,.6,[2,2]),
      {id:'vis-line',type:'line',source:'vis',paint:{'line-color':'#ffd600','line-width':2.2}},
      lab('l-country','country',1,6,13,true),lab('l-state','state',4,8,12,true),
      lab('l-city','city',3,22,13,true),lab('l-town','town',7,22,12,false)
    ]};
}
function initMap(){
  if(typeof maplibregl==='undefined')throw new Error('libreria della mappa non caricata');
  map=new maplibregl.Map({container:'map',style:makeStyle(),center:[12,35],zoom:1.7,maxZoom:18,attributionControl:false});
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
  let lastErr='';
  map.on('error',e=>{lastErr=(e&&e.error&&e.error.message)||lastErr});
  map.on('load',()=>{ready=true;try{map.setProjection({type:'globe'})}catch(e){}
    updateLayers();stats();$('#loading').hidden=true;toast('Zooma: appaiono confini e nomi. Tocca per colorare')});
  map.on('click',e=>handleClick(e.lngLat.lat,e.lngLat.lng));
  map.on('zoom',()=>{$('#bLvlT').textContent=lvFor(map.getZoom())[1]});
  setTimeout(()=>{if(!ready){started=false;$('#loadMsg').innerHTML='La mappa non si carica.<br><small style="opacity:.8">'+esc(lastErr||'connessione lenta o servizio non raggiungibile')+'</small><br><br><button class="btn p" onclick="location.reload()">Riprova</button>'}},30000);
}

/* ---------- modalità mondo / regione ---------- */
let mode='world';
const CONT=[['Europa',[[-25,34],[45,72]]],['Asia',[[26,-11],[180,78]]],['Africa',[[-20,-36],[55,38]]],['Nord America',[[-170,6],[-50,75]]],['Sud America',[[-82,-56],[-34,13]]],['Oceania',[[110,-48],[180,-5]]]];
function goRegion(b){
  if(!b)return;mode='region';
  try{map.setProjection({type:'mercator'})}catch(e){}
  map.setMinZoom(0);map.setMaxBounds(null);
  const px=(b[1][0]-b[0][0])*.35,py=(b[1][1]-b[0][1])*.35;
  map.setMaxBounds([[Math.max(-180,b[0][0]-px),Math.max(-84,b[0][1]-py)],[Math.min(180,b[1][0]+px),Math.min(84,b[1][1]+py)]]);
  map.fitBounds(b,{padding:30,duration:0,maxZoom:10});
  map.once('moveend',()=>{if(mode==='region')map.setMinZoom(Math.max(0,map.getZoom()-1.2))});
  $('#bWorld').hidden=false;
}
function goWorld(){
  mode='world';map.setMinZoom(0);map.setMaxBounds(null);
  try{map.setProjection({type:'globe'})}catch(e){}
  map.jumpTo({center:[12,35],zoom:1.7});$('#bWorld').hidden=true;
}
$('#bWorld').onclick=goWorld;

/* ---------- controlli ---------- */
$('#zi').onclick=()=>map&&map.zoomIn();$('#zo').onclick=()=>map&&map.zoomOut();
$('#bLvl').onclick=()=>toast('Il livello cambia con lo zoom: da vicino tocchi sempre il comune');
function modal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()};return m}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}

$('#bNation').onclick=()=>{
  const list=[...features].sort((a,b)=>itName(a).localeCompare(itName(b),'it'));
  const m=modal(`<div class="box"><h2>Dove vuoi andare?</h2><div class="sub">La mappa diventa quella del continente o della nazione scelta. Il globo serve solo come punto di partenza.</div>
    <div class="body"><div class="cgrid" id="cg"></div><input type="text" id="q" placeholder="Cerca una nazione…" autocomplete="off"><ul class="list" id="ul"></ul></div>
    <div class="foot"><button class="btn" id="x">Chiudi</button></div></div>`);
  const cg=m.querySelector('#cg');
  const w=document.createElement('button');w.className='w';w.textContent='🌍 Mondo (globo)';w.onclick=()=>{closeModal();goWorld()};cg.appendChild(w);
  CONT.forEach(([n,b])=>{const e=document.createElement('button');e.textContent=n;e.onclick=()=>{closeModal();goRegion(b)};cg.appendChild(e)});
  const ul=m.querySelector('#ul');
  const fill=q=>{const k=norm(q);ul.innerHTML='';
    list.filter(f=>!k||norm(itName(f)).includes(k)||norm(f.properties.NAME).includes(k)).forEach(f=>{
      const li=document.createElement('li');li.innerHTML=`<span>${esc(itName(f))}</span>${visited.has(f.properties.ADMIN)?'<em>✓ visitato</em>':''}`;
      li.onclick=()=>{closeModal();goRegion(mainBounds(f.geometry))};ul.appendChild(li)})};
  fill('');m.querySelector('#q').oninput=e=>fill(e.target.value);m.querySelector('#x').onclick=closeModal;
};

async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&polygon_geojson=1&polygon_threshold=0.0005&accept-language=it&q='+encodeURIComponent(q));
  const j=await r.json();if(!j[0])return null;
  let g=j[0].geojson;
  if(!g||(g.type!=='Polygon'&&g.type!=='MultiPolygon'))g=circle(+j[0].lon,+j[0].lat,j[0].category==='place'?.03:.15);
  return{id:(j[0].osm_type||'x')+(j[0].osm_id||j[0].place_id),name:(j[0].display_name||q).split(',')[0],geometry:g};
}
$('#bAdd').onclick=()=>{
  const m=modal(`<div class="box"><h2>Aggiungi manualmente</h2>
    <div class="sub">Scrivi uno o più posti (paesi, regioni, città, isole…): uno per riga, oppure separati da virgola. Poi un unico OK.</div>
    <div class="body"><textarea id="t" placeholder="Napoli&#10;Malnate&#10;Lugano&#10;Monte Amiata"></textarea></div>
    <div class="foot"><span class="msg" id="msg"></span><button class="btn" id="x">Annulla</button><button class="btn p" id="ok">OK</button></div></div>`);
  const t=m.querySelector('#t'),msg=m.querySelector('#msg'),ok=m.querySelector('#ok');
  m.querySelector('#x').onclick=closeModal;setTimeout(()=>t.focus(),50);
  ok.onclick=async()=>{
    const raw=t.value;const items=(/[\n;]/.test(raw)?raw.split(/[\n;]+/):raw.split(',')).map(s=>s.trim()).filter(Boolean);
    if(!items.length)return;ok.disabled=true;const added=[],missed=[];let last=null,lastCountry=null;
    for(let i=0;i<items.length;i++){
      msg.textContent=`Cerco ${items[i]} (${i+1}/${items.length})…`;
      const f=index.get(norm(items[i]));
      if(f){visited.add(f.properties.ADMIN);added.push(itName(f));last=f.geometry;lastCountry=f;continue}
      try{const g=await geocode(items[i]);
        if(g){if(!customs.some(c=>c.id===g.id))customs.push(g);added.push(g.name);last=g.geometry}else missed.push(items[i]);
        if(i<items.length-1)await new Promise(r=>setTimeout(r,1100));
      }catch(e){missed.push(items[i])}
    }
    refresh();ok.disabled=false;
    if(missed.length){t.value=missed.join('\n');msg.textContent='Non trovati: rivedi i nomi rimasti e riprova.';if(added.length)toast('Aggiunti: '+added.join(', '))}
    else{closeModal();toast('Aggiunti: '+added.join(', '));if(last&&added.length===1){lastCountry?goRegion(mainBounds(last)):flyTo(last,11)}}
  };
};
$('#reset').onclick=()=>{if(confirm('Vuoi azzerare tutta la mappa?')){visited.clear();customs=[];refresh()}};

/* ---------- avvio ---------- */
const tmo=(p,ms,l)=>new Promise((res,rej)=>{const x=setTimeout(()=>rej(new Error(l+': troppo lento')),ms);p.then(v=>{clearTimeout(x);res(v)},e=>{clearTimeout(x);rej(e)})});
async function loadGeo(){let last;
  for(const u of GEOS){try{const r=await tmo(fetch(u),40000,'confini');if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await tmo(r.json(),40000,'confini');if(j&&j.features&&j.features.length)return j;throw new Error('dati vuoti')}catch(e){last=e}}
  throw last||new Error('confini non raggiungibili')}
async function start(){
  if(started)return;started=true;
  $('#app').hidden=false;$('#loading').hidden=false;
  let step='confini dei paesi';
  try{
    $('#loadMsg').textContent='Carico il mondo…';
    const gj=await loadGeo();
    features=gj.features.filter(f=>f.properties&&f.properties.ADMIN&&f.geometry);
    if(!features.length)throw new Error('nessun paese nei dati');
    buildIndex();
    step='mappa';$('#loadMsg').textContent='Costruisco la mappa…';
    initMap();
  }catch(e){
    started=false;
    $('#loadMsg').innerHTML='Qualcosa non va nel passo: <b>'+step+'</b><br><small style="opacity:.8">'+esc(e&&e.message||e)+'</small><br><br><button class="btn p" onclick="location.reload()">Riprova</button>';
  }
}
$('#explore').onclick=()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').hidden=true,500);start()};
})();
</script>
